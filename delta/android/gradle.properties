# 4G heap leaves headroom on a 16 GB machine (the template's 8 GB default
# can get the build OOM-killed).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
# another_telephony compiles Java for 11 but Kotlin for 1.8; Kotlin 2.x fails the
# build on that mismatch. Downgrade the check to a warning until the plugin is fixed.
kotlin.jvm.target.validation.mode=warning
